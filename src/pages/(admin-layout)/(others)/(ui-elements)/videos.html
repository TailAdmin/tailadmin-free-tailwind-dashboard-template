<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Videos | TailAdmin - Tailwind CSS Admin Dashboard Template</title>
  </head>
  <body
    x-data="{ page: 'videos', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/layout/app-layout/sidebar/index.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- ===== Main Content Start ===== -->
        <main id="main-content">
          <!-- ===== Header Start ===== -->
          <include src="./partials/layout/app-layout/header/index.html" />
          <!-- ===== Header End ===== -->
          <div
            class="mx-auto max-w-(--breakpoint-2xl) p-4 pb-20 md:p-6 md:pb-6"
          >
            <!-- Breadcrumb Start -->
            <div x-data="{ pageTitle: 'Videos' }">
              <include src="./partials/common/page-breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div class="grid grid-cols-1 gap-5 sm:gap-6 xl:grid-cols-2">
              <div class="space-y-5 sm:space-y-6">
                <!-- Video Ratio 16:9 Card Start -->
                <div
                  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
                >
                  <div x-data="{ cardTitle: 'Video Ratio 16:9' }">
                    <include
                      src="./partials/common/component-card-header.html"
                    />
                  </div>
                  <div
                    class="border-t border-gray-100 p-4 sm:p-6 dark:border-gray-800"
                  >
                    <include
                      src="./partials/others/ui-elements/videos/ratio-16-9.html"
                    />
                  </div>
                </div>
                <!-- Video Ratio 16:9 Card End -->

                <!-- Video Ratio 4:3 Card Start -->
                <div
                  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
                >
                  <div x-data="{ cardTitle: 'Video Ratio 4:3' }">
                    <include
                      src="./partials/common/component-card-header.html"
                    />
                  </div>
                  <div
                    class="border-t border-gray-100 p-4 sm:p-6 dark:border-gray-800"
                  >
                    <include
                      src="./partials/others/ui-elements/videos/ratio-4-3.html"
                    />
                  </div>
                </div>
                <!-- Video Ratio 4:3 Card End -->
              </div>

              <div class="space-y-5 sm:space-y-6">
                <!-- Video Ratio 21:9 Card Start -->
                <div
                  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
                >
                  <div x-data="{ cardTitle: 'Video Ratio 21:9' }">
                    <include
                      src="./partials/common/component-card-header.html"
                    />
                  </div>
                  <div
                    class="border-t border-gray-100 p-4 sm:p-6 dark:border-gray-800"
                  >
                    <include
                      src="./partials/others/ui-elements/videos/ratio-21-9.html"
                    />
                  </div>
                </div>
                <!-- Video Ratio 21:9 Card End -->

                <!-- Video Ratio 1:1 Card Start -->
                <div
                  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
                >
                  <div x-data="{ cardTitle: 'Video Ratio 1:1' }">
                    <include
                      src="./partials/common/component-card-header.html"
                    />
                  </div>
                  <div
                    class="border-t border-gray-100 p-4 sm:p-6 dark:border-gray-800"
                  >
                    <include
                      src="./partials/others/ui-elements/videos/ratio-1-1.html"
                    />
                  </div>
                </div>
                <!-- Video Ratio 1:1 Card End -->
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
