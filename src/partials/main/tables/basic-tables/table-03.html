                x-if="item === 'ellipsis-start' || item === 'ellipsis-end' || item === '...'"
              >
                <span
                  aria-hidden="true"
                  class="flex size-10 animate-in items-center justify-center rounded-[10px] border border-gray-300 bg-white font-medium text-gray-700 shadow-theme-xs duration-150 fade-in-0 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300"
                >
                  ...
                  <span class="sr-only">More pages</span>
                </span>
              </template>
              <template x-if="typeof item === 'number'">
                <button
                  type="button"
                  :aria-label="'page ' + item"
                  :aria-current="currentPage === item ? 'page' : undefined"
                  @click="setPage(item - 1)"
                  class="inline-flex size-10 shrink-0 animate-in items-center justify-center rounded-[10px] text-sm font-medium shadow-theme-xs transition-all duration-150 fade-in-0 outline-none select-none focus-visible:outline-hidden active:translate-y-px"
                  :class="currentPage === item 
                    ? 'border border-transparent bg-brand-500 text-white hover:bg-brand-600 focus-visible:ring-3 focus-visible:ring-brand-500/20 dark:bg-brand-500 dark:hover:bg-brand-600' 
                    : 'border border-gray-300 bg-transparent text-gray-700 hover:bg-gray-50 hover:text-gray-800 focus-visible:ring-3 focus-visible:ring-gray-300/50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white'"
                  x-text="item"
                ></button>
              </template>
            </li>
          </template>

          <!-- Next Button -->
          <li>
            <button
              type="button"
              aria-label="Next page"
              :aria-disabled="currentPage === totalPages"
              :tabindex="currentPage === totalPages ? -1 : undefined"
              :disabled="currentPage === totalPages"
              @click="nextPage()"
              class="inline-flex size-10 shrink-0 items-center justify-center rounded-[10px] border border-gray-300 bg-transparent text-sm font-medium text-gray-700 shadow-theme-xs transition-all outline-none select-none focus-visible:ring-3 focus-visible:ring-gray-300/50 focus-visible:outline-hidden dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300"
              :class="currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50 hover:text-gray-800 active:translate-y-px dark:hover:bg-gray-700/50 dark:hover:text-white'"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-5 shrink-0 rtl:rotate-180"
              >
                <path d="M9 18l6-6-6-6" />
              </svg>
            </button>
          </li>
        </ul>
      </nav>
    </template>
  </div>
</div>
