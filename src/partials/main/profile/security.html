<div
  x-data="{
    isPasswordModalOpen: false,
    twoFactorEnabled: false,
    passwordForm: {
      currentPassword: '',
      newPassword: '',
      confirmPassword: ''
    },
    openPasswordModal() {
      this.passwordForm = {
        currentPassword: '',
        newPassword: '',
        confirmPassword: ''
      };
      this.isPasswordModalOpen = true;
    },
    savePassword() {
      this.isPasswordModalOpen = false;
    }
  }"
  class="rounded-2xl border border-gray-200 bg-white p-5 lg:p-6 dark:border-gray-800 dark:bg-white/3"
>
  <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">
    Security
  </h4>

  <div class="mt-1">
    <!-- Change Password -->
    <div
      class="flex flex-col justify-between gap-4 border-b border-gray-200 py-4 first:pt-0 sm:flex-row sm:items-center dark:border-gray-800"
    >
      <div>
        <h4 class="mb-1 text-base font-medium text-gray-800 dark:text-white/90">
          Change Password
        </h4>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Receive real-time notifications and team alerts.
        </p>
      </div>
      <div class="flex shrink-0 items-center">
        <button
          type="button"
          @click="openPasswordModal()"
          class="inline-flex shrink-0 items-center justify-center gap-2 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm font-medium text-gray-700 shadow-theme-xs transition-all outline-none select-none hover:bg-gray-50 hover:text-gray-800 focus-visible:ring-3 focus-visible:ring-gray-300/50 active:translate-y-px dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white"
        >
          <svg
            class="size-5"
            width="21"
            height="21"
            viewBox="0 0 21 21"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M17.091 3.532a2.25 2.25 0 00-3.182 0l-8.302 8.302c-.308.308-.52.7-.61 1.126l-.735 3.485a.75.75 0 00.888.889l3.485-.735a2.25 2.25 0 001.127-.611l8.301-8.302a2.25 2.25 0 000-3.182l-.972-.972zm-2.121 1.06a.75.75 0 011.06 0l.973.973a.75.75 0 010 1.06l-.899.899-2.033-2.033.899-.898zm-1.96 1.96l-6.342 6.342a.75.75 0 00-.203.376l-.498 2.358 2.358-.497a.75.75 0 00.376-.204l6.343-6.342-2.033-2.033z"
              fill="currentColor"
            />
          </svg>
          <span>Change Password</span>
        </button>
      </div>
    </div>

    <!-- 2FA -->
    <div
      class="flex flex-col justify-between gap-4 py-4 first:pt-0 sm:flex-row sm:items-center"
    >
      <div>
        <h4 class="mb-1 text-base font-medium text-gray-800 dark:text-white/90">
          Two-factor authentication (2FA)
        </h4>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Keep your account secure by enabling 2FA
        </p>
      </div>
      <div class="flex shrink-0 items-center">
        <button
          type="button"
          role="switch"
          :aria-checked="twoFactorEnabled.toString()"
          @click="twoFactorEnabled = !twoFactorEnabled"
          aria-label="Toggle two-factor authentication"
          class="relative inline-flex h-5 w-11 shrink-0 cursor-pointer items-center rounded-full p-[1.5px] outline-hidden transition-colors select-none focus-visible:ring-2 focus-visible:ring-brand-500/20 dark:focus-visible:ring-brand-500/30"
          :class="twoFactorEnabled ? 'bg-brand-500 hover:bg-brand-600 dark:bg-brand-500 dark:hover:bg-brand-600' : 'bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600'"
        >
          <span
            class="pointer-events-none block h-[17px] w-[26px] shrink-0 rounded-full bg-white shadow-theme-sm ring-0 transition-transform duration-150 ease-linear"
            :class="twoFactorEnabled ? 'translate-x-[15px] rtl:-translate-x-[15px]' : 'translate-x-0 rtl:translate-x-0'"
          ></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <include src="./change-password-modal.html" />
</div>
