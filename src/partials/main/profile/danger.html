          Logout all devices
        </h4>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Sign out from every active session.
        </p>
      </div>
      <div class="flex shrink-0 items-center">
        <button
          type="button"
          class="inline-flex shrink-0 items-center justify-center gap-2 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm font-medium text-gray-700 shadow-theme-xs transition-all outline-none select-none hover:bg-gray-50 hover:text-gray-800 focus-visible:ring-3 focus-visible:ring-gray-300/50 active:translate-y-px dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white"

            height="24"
            viewBox="0 0 24 24"
            fill="none"

            <path
              d="M4 12h7.75M8 8l-3.998 4 3.997 4M9.75 4.996V4.25a1.5 1.5 0 011.5-1.5h6a1.5 1.5 0 011.5 1.5v15.5a1.5 1.5 0 01-1.5 1.5h-6a1.5 1.5 0 01-1.5-1.5V19"

        </button>

    >
      <div>
        <h4 class="mb-1 text-base font-medium text-gray-800 dark:text-white/90">
          Delete account
        </h4>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Permanently remove your account and all data.
        </p>
      </div>
      <div class="flex shrink-0 items-center">
        <button
          type="button"
          class="inline-flex shrink-0 items-center justify-center gap-2 rounded-lg border border-red-300 bg-transparent px-4 py-2.5 text-sm font-medium text-red-500 shadow-theme-xs transition-all outline-none select-none hover:bg-red-50 hover:text-red-600 focus-visible:ring-3 focus-visible:ring-red-500/20 active:translate-y-px dark:border-red-500/40 dark:text-red-400 dark:hover:bg-red-500/10"

            height="20"
