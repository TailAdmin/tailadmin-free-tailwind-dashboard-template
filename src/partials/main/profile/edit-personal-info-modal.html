<!-- Edit Personal Information Modal -->
<div
  x-show="isDialogOpen"
  x-cloak
  @keydown.escape.window="isDialogOpen = false"
  class="fixed inset-0 z-99999 flex items-center justify-center overflow-y-auto p-4 sm:p-5"
  style="display: none"
>
  <!-- Backdrop -->
  <div
    @click="isDialogOpen = false"
    x-show="isDialogOpen"
    x-transition.opacity
    class="fixed inset-0 bg-gray-400/50 backdrop-blur-[32px] dark:bg-black/80"
  ></div>

  <!-- Modal Dialog -->
  <div
    x-show="isDialogOpen"
    x-transition
    @click.outside="isDialogOpen = false"
    class="relative no-scrollbar flex max-h-[90vh] w-full max-w-2xl flex-col overflow-y-auto rounded-3xl bg-white p-6 sm:p-8 dark:bg-gray-900"
  >
    <!-- Close Button -->
    <button
      @click="isDialogOpen = false"
      type="button"
      class="absolute top-5 right-5 z-20 flex size-9 items-center justify-center rounded-full bg-gray-100 text-gray-400 transition-all outline-none select-none hover:bg-gray-200 hover:text-gray-600 active:translate-y-px dark:bg-white/5 dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-300"
      aria-label="Close"
    >
      <svg
        class="size-5 fill-current"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M6.04289 16.5418C5.65237 16.9323 5.65237 17.5655 6.04289 17.956C6.43342 18.3465 7.06658 18.3465 7.45711 17.956L11.9987 13.4144L16.5408 17.9565C16.9313 18.347 17.5645 18.347 17.955 17.9565C18.3455 17.566 18.3455 16.9328 17.955 16.5423L13.4129 12.0002L17.955 7.45808C18.3455 7.06756 18.3455 6.43439 17.955 6.04387C17.5645 5.65335 16.9313 5.65335 16.5408 6.04387L11.9987 10.586L7.45711 6.04439C7.06658 5.65386 6.43342 5.65386 6.04289 6.04439C5.65237 6.43491 5.65237 7.06808 6.04289 7.4586L10.5845 12.0002L6.04289 16.5418Z"
        />
      </svg>
    </button>

    <div class="pe-10">
      <h3
        class="text-xl font-semibold text-gray-800 sm:text-2xl dark:text-white/90"
      >
        Edit Personal Information
      </h3>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        Update your details to keep your profile up-to-date.
      </p>
    </div>

    <form @submit.prevent="saveChanges()" class="mt-4 space-y-6" novalidate>
      <!-- Change Profile Picture -->
      <div class="space-y-4">
        <h4 class="text-base font-medium text-gray-800 dark:text-white/90">
          Change Profile Picture
        </h4>

        <div class="flex items-center gap-4 sm:gap-6">
          <div class="relative">
            <div
              class="size-20 shrink-0 overflow-hidden rounded-full sm:size-24"
            >
              <img
                :src="avatarPreview || profileData.avatarUrl"
                :alt="profileData.fullName"
                class="size-full object-cover"
              />
            </div>

            <!-- Overlaid Camera Button -->
            <label
              for="profile-avatar-file-input"
              class="absolute inset-e-0 bottom-0 flex size-8 cursor-pointer items-center justify-center rounded-full border border-gray-200 bg-white text-gray-600 shadow-theme-xs transition-colors hover:bg-gray-50 hover:text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"
              aria-label="Upload profile picture"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="size-4.5"
              >
                <path
                  d="M12.6732 3.41872C12.4373 3.10275 12.066 2.91667 11.6717 2.91667H8.32825C7.93391 2.91667 7.56268 3.10275 7.32672 3.41872L6.83189 4.08131C6.59593 4.39727 6.2247 4.58336 5.83036 4.58336H3.54167C2.85131 4.58336 2.29167 5.14301 2.29167 5.83336V14.375C2.29167 15.0654 2.85131 15.625 3.54167 15.625H16.4583C17.1487 15.625 17.7083 15.0654 17.7083 14.375V5.83336C17.7083 5.14301 17.1487 4.58336 16.4583 4.58336H14.1696C13.7752 4.58336 13.404 4.39727 13.1681 4.08131L12.6732 3.41872Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M13.3333 9.79329C13.3333 11.6342 11.8409 13.1266 10 13.1266C8.15905 13.1266 6.66667 11.6342 6.66667 9.79329C6.66667 7.95234 8.15905 6.45996 10 6.45996C11.8409 6.45996 13.3333 7.95234 13.3333 9.79329Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </label>

            <input
              type="file"
              id="profile-avatar-file-input"
              accept="image/png,image/jpeg,image/webp"
              @change="handleAvatarChange($event)"
              class="hidden"
            />
          </div>

          <div
            class="flex flex-col gap-1 text-sm text-gray-500 dark:text-gray-400"
          >
            <p class="font-normal">Upload a square image (200×200 px)</p>
            <p class="font-normal">in JPEG or PNG format.</p>
          </div>
        </div>
      </div>

      <!-- Personal Information Fields -->
      <div class="space-y-4">
        <h4 class="text-base font-medium text-gray-800 dark:text-white/90">
          Personal Information
        </h4>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              First Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              x-model="editForm.firstName"
              placeholder="Enter first name"
              required
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Last Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              x-model="editForm.lastName"
              placeholder="Enter last name"
              required
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Email Address <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              x-model="editForm.email"
              placeholder="info@example.com"
              required
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Phone <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              x-model="editForm.phone"
              placeholder="+09 363 398 46"
              required
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>
        </div>

        <div>
          <label
            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
          >
            Bio
          </label>
          <textarea
            x-model="editForm.bio"
            rows="3"
            placeholder="Write a brief bio..."
            class="w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
          ></textarea>
        </div>
      </div>

      <!-- Social Links Fields -->
      <div class="space-y-4">
        <h4 class="text-base font-medium text-gray-800 dark:text-white/90">
          Social Links
        </h4>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Facebook
            </label>
            <input
              type="url"
              x-model="editForm.socialLinks.facebook"
              placeholder="https://facebook.com/username"
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              X.com
            </label>
            <input
              type="url"
              x-model="editForm.socialLinks.x"
              placeholder="https://x.com/username"
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Linkedin
            </label>
            <input
              type="url"
              x-model="editForm.socialLinks.linkedin"
              placeholder="https://linkedin.com/in/username"
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <div>
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Instagram
            </label>
            <input
              type="url"
              x-model="editForm.socialLinks.instagram"
              placeholder="https://instagram.com/username"
              class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="flex flex-col-reverse justify-end gap-3 pt-3 sm:flex-row">
        <button
          type="button"
          @click="isDialogOpen = false"
          class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 shadow-theme-xs transition-all outline-none select-none hover:bg-gray-50 active:translate-y-px dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/3"
        >
          Close
        </button>
        <button
          type="submit"
          class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs transition-all outline-none select-none hover:bg-brand-600 active:translate-y-px"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
