<div
  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
>
  <!-- Card Header -->
  <div class="px-6 py-5">
    <h3 class="text-base font-medium text-gray-800 dark:text-white/90">
      Input Group
    </h3>
  </div>

  <!-- Card Body -->
  <div
    class="space-y-6 border-t border-gray-100 p-4 sm:p-6 dark:border-gray-800"
  >
    <!-- Email Input -->
    <div>
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        Email
      </label>
      <div
        class="relative flex h-11 w-full min-w-0 items-center overflow-hidden rounded-[10px] border border-gray-300 bg-white shadow-theme-xs outline-hidden transition-colors focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:focus-within:border-brand-500/40"
      >
        <span
          class="flex h-auto items-center justify-center self-stretch border-e border-gray-200 ps-3.5 pe-3 text-gray-500 dark:border-gray-800 dark:text-gray-400"
        >
          <svg
            class="size-5"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M3.042 7.062v7.313a.5.5 0 00.5.5h12.916a.5.5 0 00.5-.5V7.062l-5.814 4.055a2 2 0 01-2.288 0L3.042 7.062zm13.916-1.87V5.2a.072.072 0 01-.03.055l-6.642 4.631a.5.5 0 01-.572 0L3.072 5.255a.071.071 0 01.041-.13h13.774c.038 0 .07.03.071.068zm1.5.022v9.161a2 2 0 01-2 2H3.542a2 2 0 01-2-2v-9.18-.03a1.571 1.571 0 011.571-1.54h13.774c.868 0 1.571.703 1.571 1.571v.018z"
              fill="currentColor"
            />
          </svg>
        </span>
        <input
          type="email"
          placeholder="info@gmail.com"
          class="h-full flex-1 rounded-none border-0 bg-transparent px-4 py-2.5 text-sm font-normal text-gray-800 shadow-none placeholder:text-gray-400 focus:border-transparent focus:ring-0 focus:outline-hidden dark:text-white/90 dark:placeholder:text-gray-500"
        />
      </div>
    </div>

    <!-- Phone Input Start -->
    <div>
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        Phone
      </label>
      <div
        class="relative flex h-11 w-full min-w-0 items-center overflow-hidden rounded-[10px] border border-gray-300 bg-white shadow-theme-xs outline-hidden transition-colors focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:focus-within:border-brand-500/40"
      >
        <div
          class="relative flex h-full items-center border-e border-gray-200 dark:border-gray-800"
        >
          <select
            class="h-full cursor-pointer appearance-none border-0 border-none bg-transparent py-0 ps-3.5 pe-8 text-sm font-medium text-gray-700 shadow-none outline-hidden focus:border-0 focus:ring-0 focus:outline-hidden dark:text-gray-300 dark:hover:text-white dark:focus:text-white"
          >
            <option
              value="US"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              US
            </option>
            <option
              value="GB"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              GB
            </option>
            <option
              value="CA"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              CA
            </option>
            <option
              value="AU"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              AU
            </option>
          </select>
          <svg
            class="pointer-events-none absolute inset-e-2.5 size-4 text-gray-500 dark:text-gray-400"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5.83325 7.91666L9.99992 12.0833L14.1666 7.91666"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <input
          type="tel"
          placeholder="+1 (555) 000-0000"
          class="h-full flex-1 rounded-none border-0 bg-transparent px-4 py-2.5 text-sm font-normal text-gray-800 shadow-none placeholder:text-gray-400 focus:border-transparent focus:ring-0 focus:outline-hidden dark:text-white/90 dark:placeholder:text-gray-500"
        />
      </div>
    </div>

    <!-- Phone Input End -->
    <div>
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        Phone
      </label>
      <div
        class="relative flex h-11 w-full min-w-0 items-center overflow-hidden rounded-[10px] border border-gray-300 bg-white shadow-theme-xs outline-hidden transition-colors focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:focus-within:border-brand-500/40"
      >
        <input
          type="tel"
          placeholder="+1 (555) 000-0000"
          class="h-full flex-1 rounded-none border-0 bg-transparent px-4 py-2.5 text-sm font-normal text-gray-800 shadow-none placeholder:text-gray-400 focus:border-transparent focus:ring-0 focus:outline-hidden dark:text-white/90 dark:placeholder:text-gray-500"
        />
        <div
          class="relative flex h-full items-center border-s border-gray-200 dark:border-gray-800"
        >
          <select
            class="h-full cursor-pointer appearance-none border-0 border-none bg-transparent py-0 ps-3.5 pe-8 text-sm font-medium text-gray-700 shadow-none outline-hidden focus:border-0 focus:ring-0 focus:outline-hidden dark:text-gray-300 dark:hover:text-white dark:focus:text-white"
          >
            <option
              value="US"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              US
            </option>
            <option
              value="GB"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              GB
            </option>
            <option
              value="CA"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              CA
            </option>
            <option
              value="AU"
              class="text-gray-700 dark:bg-gray-900 dark:text-gray-300"
            >
              AU
            </option>
          </select>
          <svg
            class="pointer-events-none absolute inset-e-2.5 size-4 text-gray-500 dark:text-gray-400"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5.83325 7.91666L9.99992 12.0833L14.1666 7.91666"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- URL Input -->
    <div>
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        URL
      </label>
      <div
        class="relative flex h-11 w-full min-w-0 items-center overflow-hidden rounded-[10px] border border-gray-300 bg-white shadow-theme-xs outline-hidden transition-colors focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:focus-within:border-brand-500/40"
      >
        <span
          class="flex h-auto items-center justify-center self-stretch border-e border-gray-200 ps-3.5 pe-3 text-sm font-normal text-gray-500 dark:border-gray-800 dark:text-gray-400"
        >
          http://
        </span>
        <input
          type="text"
          placeholder="www.tailadmin.com"
          class="h-full flex-1 rounded-none border-0 bg-transparent px-4 py-2.5 text-sm font-normal text-gray-800 shadow-none placeholder:text-gray-400 focus:border-transparent focus:ring-0 focus:outline-hidden dark:text-white/90 dark:placeholder:text-gray-500"
        />
      </div>
    </div>

    <!-- Copy Input -->
    <div
      x-data="{
        value: 'www.tailadmin.com',
        copied: false,
        async copy() {
          try {
            await navigator.clipboard.writeText(this.value);
            this.copied = true;
            setTimeout(() => this.copied = false, 2000);
          } catch (e) {
            console.error(e);
          }
        }
      }"
    >
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        Website
      </label>
      <div
        class="relative flex h-11 w-full min-w-0 items-center overflow-hidden rounded-[10px] border border-gray-300 bg-white shadow-theme-xs outline-hidden transition-colors focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:focus-within:border-brand-500/40"
      >
        <input
          type="text"
          x-model="value"
          placeholder="www.tailadmin.com"
          class="h-full flex-1 rounded-none border-0 bg-transparent px-4 py-2.5 text-sm font-normal text-gray-800 shadow-none placeholder:text-gray-400 focus:border-transparent focus:ring-0 focus:outline-hidden dark:text-white/90 dark:placeholder:text-gray-500"
        />
        <div class="self-stretch border-s border-gray-200 dark:border-gray-800">
          <button
            type="button"
            @click="copy()"
            class="flex h-full cursor-pointer items-center gap-1.5 rounded-e-[10px] px-3.5 text-sm font-medium text-gray-700 transition-all select-none hover:bg-gray-50 hover:text-gray-900 focus:outline-hidden active:translate-y-px dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-white"
          >
            <template x-if="copied">
              <span class="inline-flex items-center gap-1.5 text-green-500">
                <svg
                  class="size-4"
                  viewBox="0 0 16 16"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M13.3334 4L6.00008 11.3333L2.66675 8"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span>Copied!</span>
              </span>
            </template>
            <template x-if="!copied">
              <span class="inline-flex items-center gap-1.5">
                <svg
                  class="size-4 text-gray-500 dark:text-gray-400"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M6.588 4.584a.5.5 0 01.5-.5h8.327a.5.5 0 01.5.5v8.329a.5.5 0 01-.5.5H7.088a.5.5 0 01-.5-.5V4.584zm.5-2a2 2 0 00-2 2v.51h-.503a2 2 0 00-2 2v8.322a2 2 0 002 2h8.322a2 2 0 002-2v-.503h.508a2 2 0 002-2V4.584a2 2 0 00-2-2H7.088zm6.319 12.329H7.088a2 2 0 01-2-2V6.594h-.503a.5.5 0 00-.5.5v8.322a.5.5 0 00.5.5h8.322a.5.5 0 00.5-.5v-.503z"
                    fill="currentColor"
                  />
                </svg>
                <span>Copy</span>
              </span>
            </template>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
