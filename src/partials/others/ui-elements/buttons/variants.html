<div class="flex flex-wrap items-center gap-4">
  <!-- Default Button -->
  <button
    type="button"
    class="inline-flex items-center justify-center gap-2 rounded-[10px] border border-transparent bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs transition-all outline-none select-none hover:bg-brand-600 focus-visible:ring-3 focus-visible:ring-brand-500/20 focus-visible:outline-hidden active:translate-y-px disabled:pointer-events-none disabled:bg-brand-200 disabled:text-white dark:bg-brand-500 dark:hover:bg-brand-600 dark:disabled:bg-brand-800 dark:disabled:text-brand-400"
  >
    Default
  </button>

  <!-- Destructive Button -->
  <button
    type="button"
    class="inline-flex items-center justify-center gap-2 rounded-[10px] border border-transparent bg-red-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs transition-all outline-none select-none hover:bg-red-600 focus-visible:ring-3 focus-visible:ring-red-500/20 focus-visible:outline-hidden active:translate-y-px disabled:pointer-events-none disabled:bg-red-200 disabled:text-white dark:bg-red-500 dark:hover:bg-red-600 dark:disabled:bg-red-950 dark:disabled:text-red-400"
  >
    Destructive
  </button>

  <!-- Outline Button -->
  <button
    type="button"
    class="inline-flex items-center justify-center gap-2 rounded-[10px] border border-gray-300 bg-transparent px-4 py-2.5 text-sm font-medium text-gray-700 shadow-theme-xs transition-all outline-none select-none hover:bg-gray-50 hover:text-gray-800 focus-visible:ring-3 focus-visible:ring-gray-300/50 focus-visible:outline-hidden active:translate-y-px disabled:pointer-events-none disabled:border-gray-200 disabled:bg-white disabled:text-gray-300 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white dark:disabled:border-gray-800 dark:disabled:bg-gray-900 dark:disabled:text-gray-600"
  >
    Outline
  </button>

  <!-- Ghost Button -->
  <button
    type="button"
    class="inline-flex items-center justify-center gap-2 rounded-[10px] border-none bg-transparent px-4 py-2.5 text-sm font-medium text-gray-700 transition-all outline-none select-none hover:bg-gray-50 hover:text-gray-800 focus-visible:ring-3 focus-visible:ring-gray-300/50 focus-visible:outline-hidden active:translate-y-px disabled:pointer-events-none disabled:border-gray-200 disabled:bg-white disabled:text-gray-300 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white dark:disabled:border-gray-800 dark:disabled:bg-gray-900 dark:disabled:text-gray-600"
  >
    Ghost
  </button>

  <!-- Link Button -->
  <button
    type="button"
    class="inline-flex items-center justify-center gap-2 text-sm font-normal text-brand-500 underline-offset-4 transition hover:underline focus-visible:outline-hidden dark:text-brand-400"
  >
    Link
  </button>
</div>
