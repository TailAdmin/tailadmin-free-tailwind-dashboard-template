<div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6">
  <!-- Primary -->
  <span
    class="inline-flex h-6 w-fit shrink-0 items-center justify-center gap-1 rounded-lg bg-brand-50 px-2.5 py-0.5 text-sm font-medium whitespace-nowrap text-brand-500 transition-colors select-none [text-shadow:0_4px_4px_var(--color-brand-200)] dark:bg-brand-500/15 dark:text-brand-400 dark:[text-shadow:0_4px_4px_rgba(70,95,255,0.20)]"
  >
    Primary
  </span>

  <!-- Success -->
  <span
    class="inline-flex h-6 w-fit shrink-0 items-center justify-center gap-1 rounded-lg bg-green-50 px-2.5 py-0.5 text-sm font-medium whitespace-nowrap text-green-600 transition-colors select-none [text-shadow:0_4px_4px_var(--color-green-200)] dark:bg-green-500/15 dark:text-green-500 dark:[text-shadow:0_4px_4px_rgba(18,183,106,0.20)]"
  >
    Success
  </span>

  <!-- Error -->
  <span
    class="inline-flex h-6 w-fit shrink-0 items-center justify-center gap-1 rounded-lg bg-red-50 px-2.5 py-0.5 text-sm font-medium whitespace-nowrap text-red-600 transition-colors select-none [text-shadow:0_4px_4px_var(--color-red-200)] dark:bg-red-500/15 dark:text-red-500 dark:[text-shadow:0_4px_4px_rgba(240,68,56,0.20)]"
  >
    Error
  </span>

  <!-- Warning -->
  <span
    class="inline-flex h-6 w-fit shrink-0 items-center justify-center gap-1 rounded-lg bg-amber-50 px-2.5 py-0.5 text-sm font-medium whitespace-nowrap text-amber-600 transition-colors select-none [text-shadow:0_4px_4px_rgba(254,223,137,0.60)] dark:bg-amber-500/15 dark:text-orange-400 dark:[text-shadow:0_4px_4px_rgba(247,144,9,0.20)]"
  >
    Warning
  </span>

  <!-- Info -->
  <span
    class="inline-flex h-6 w-fit shrink-0 items-center justify-center gap-1 rounded-lg bg-sky-50 px-2.5 py-0.5 text-sm font-medium whitespace-nowrap text-sky-500 transition-colors select-none [text-shadow:0_4px_4px_var(--color-sky-200)] dark:bg-sky-500/15 dark:text-sky-500 dark:[text-shadow:0_4px_4px_rgba(11,165,236,0.20)]"
  >
    Info
  </span>

  <!-- Gray -->
  <span
    class="inline-flex h-6 w-fit shrink-0 items-center justify-center gap-1 rounded-lg bg-gray-100 px-2.5 py-0.5 text-sm font-medium whitespace-nowrap text-gray-700 transition-colors select-none [text-shadow:0_4px_4px_var(--color-gray-300)] dark:bg-white/5 dark:text-white/80 dark:[text-shadow:0_4px_4px_rgba(255,255,255,0.10)]"
  >
    Gray
  </span>
</div>
