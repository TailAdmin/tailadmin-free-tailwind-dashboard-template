<form>
  <div class="space-y-5">
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <!-- First Name -->
      <div>
        <label
          class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
        >
          First Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          name="fname"
          placeholder="Enter your first name"
          class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
      </div>
      <!-- Last Name -->
      <div>
        <label
          class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
        >
          Last Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          name="lname"
          placeholder="Enter your last name"
          class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
      </div>
    </div>

    <!-- Email -->
    <div>
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        Email <span class="text-red-500">*</span>
      </label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
      />
    </div>

    <!-- Password -->
    <div>
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        Password <span class="text-red-500">*</span>
      </label>
      <div x-data="{ showPassword: false }" class="relative">
        <input
          :type="showPassword ? 'text' : 'password'"
          name="password"
          placeholder="Enter your password"
          class="h-11 w-full rounded-lg border border-gray-300 bg-transparent py-2.5 ps-4 pe-11 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
        <span
          @click="showPassword = !showPassword"
          class="absolute top-1/2 right-4 z-30 -translate-y-1/2 cursor-pointer text-gray-500 rtl:right-auto rtl:left-4 dark:text-gray-400"
        >
          <svg
            x-show="!showPassword"
            class="fill-current"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M4.638 3.577a.75.75 0 00-1.06 1.06l1.275 1.277a8.03 8.03 0 00-2.437 3.545.75.75 0 000 .487 8.019 8.019 0 0011.083 4.614l1.864 1.863a.75.75 0 101.06-1.06L4.638 3.576zm7.723 9.844l-1.914-1.913c-.14.034-.289.053-.44.053h-.015a1.858 1.858 0 01-1.803-2.312l-2.27-2.27a6.532 6.532 0 00-1.996 2.723 6.518 6.518 0 008.438 3.72zm3.716-3.719a6.516 6.516 0 01-1.257 2.03l1.061 1.06a8.012 8.012 0 001.704-2.846.75.75 0 000-.487A8.019 8.019 0 007.522 4.433l1.23a6.519 6.519 0 017.326 4.04z"
              fill="currentColor"
            />
          </svg>
          <svg
            x-show="showPassword"
            class="fill-current"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M10 13.862a6.519 6.519 0 01-6.077-4.16 6.519 6.519 0 0112.154 0A6.519 6.519 0 0110 13.862zm0-9.819a8.019 8.019 0 00-7.585 5.416.75.75 0 000 .487 8.019 8.019 0 0015.17 0 .75.75 0 000-.487A8.019 8.019 0 0010 4.043zm-.008 3.801a1.858 1.858 0 100 3.716h.014a1.858 1.858 0 000-3.716h-.014z"
              fill="currentColor"
            />
          </svg>
        </span>
      </div>
    </div>

    <!-- Confirm Password -->
    <div>
      <label
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
      >
        Confirm Password <span class="text-red-500">*</span>
      </label>
      <div x-data="{ showConfirmPassword: false }" class="relative">
        <input
          :type="showConfirmPassword ? 'text' : 'password'"
          name="confirmPassword"
          placeholder="Re-enter your password"
          class="h-11 w-full rounded-lg border border-gray-300 bg-transparent py-2.5 ps-4 pe-11 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
        <span
          @click="showConfirmPassword = !showConfirmPassword"
          class="absolute top-1/2 right-4 z-30 -translate-y-1/2 cursor-pointer text-gray-500 rtl:right-auto rtl:left-4 dark:text-gray-400"
        >
          <svg
            x-show="!showConfirmPassword"
            class="fill-current"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M4.638 3.577a.75.75 0 00-1.06 1.06l1.275 1.277a8.03 8.03 0 00-2.437 3.545.75.75 0 000 .487 8.019 8.019 0 0011.083 4.614l1.864 1.863a.75.75 0 101.06-1.06L4.638 3.576zm7.723 9.844l-1.914-1.913c-.14.034-.289.053-.44.053h-.015a1.858 1.858 0 01-1.803-2.312l-2.27-2.27a6.532 6.532 0 00-1.996 2.723 6.518 6.518 0 008.438 3.72zm3.716-3.719a6.516 6.516 0 01-1.257 2.03l1.061 1.06a8.012 8.012 0 001.704-2.846.75.75 0 000-.487A8.019 8.019 0 007.522 4.433l1.23a6.519 6.519 0 017.326 4.04z"
              fill="currentColor"
            />
          </svg>
          <svg
            x-show="showConfirmPassword"
            class="fill-current"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M10 13.862a6.519 6.519 0 01-6.077-4.16 6.519 6.519 0 0112.154 0A6.519 6.519 0 0110 13.862zm0-9.819a8.019 8.019 0 00-7.585 5.416.75.75 0 000 .487 8.019 8.019 0 0015.17 0 .75.75 0 000-.487A8.019 8.019 0 0010 4.043zm-.008 3.801a1.858 1.858 0 100 3.716h.014a1.858 1.858 0 000-3.716h-.014z"
              fill="currentColor"
            />
          </svg>
        </span>
      </div>
    </div>

    <!-- Checkbox -->
    <div>
      <div x-data="{ checkboxToggle: false }">
        <label
          for="terms-conditions"
          class="flex cursor-pointer items-start text-sm font-normal text-gray-700 select-none dark:text-gray-400"
        >
          <div class="relative">
            <input
              type="checkbox"
              id="terms-conditions"
              class="sr-only"
              @change="checkboxToggle = !checkboxToggle"
            />
            <div
              :class="checkboxToggle ? 'border-brand-500 bg-brand-500' : 'bg-transparent border-gray-300 dark:border-gray-700'"
              class="mr-3 flex h-5 w-5 items-center justify-center rounded-md border-[1.25px] rtl:mr-0 rtl:ml-3"
            >
              <span :class="checkboxToggle ? '' : 'opacity-0'">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 14 14"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M11.6666 3.5L5.24992 9.91667L2.33325 7"
                    stroke="white"
                    stroke-width="1.94437"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </div>
          </div>
          <span
            class="inline-block cursor-pointer text-sm font-normal text-gray-500 dark:text-gray-400"
          >
            By creating an account means you agree to the
            <span class="text-gray-800 dark:text-white/90">
              Terms and Conditions,
            </span>
            and our
            <span class="text-gray-800 dark:text-white"> Privacy Policy </span>
          </span>
        </label>
      </div>
    </div>

    <!-- Button -->
    <div>
      <button
        type="submit"
        class="flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white shadow-theme-xs transition hover:bg-brand-600"
      >
        Sign Up
      </button>
    </div>
  </div>
</form>
